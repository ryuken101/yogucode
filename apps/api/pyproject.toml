[project]
name = "api"
version = "0.1.0"
description = "Coding-teaching-tool API — FastAPI backend"
requires-python = ">=3.12"
authors = [
    { name = "ryuken101", email = "169988777+ryuken101@users.noreply.github.com" }
]
dependencies = [
    "fastapi>=0.115",
    "sqlmodel>=0.0.22",
    "sqlalchemy[asyncio]>=2.0",  # the asyncio extra pulls in greenlet
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "asyncpg>=0.30",
    "uuid-utils>=0.10",
    "uvicorn[standard]>=0.32",
    "pyjwt[crypto]>=2.10",
    "httpx>=0.28",
    # Student PIN hashing (step 7). Parameters are set explicitly in app/auth/pin.py,
    # not left at the library default — see the comment there for the memory arithmetic.
    "argon2-cffi>=23.1",
    # The concept taxonomy loader (step 8). Present transitively via uvicorn[standard],
    # but relying on an unrelated package's extra is how an import breaks on an upgrade.
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "httpx-ws>=0.9.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[project.scripts]
# Idempotent taxonomy seed: `uv run seed-concepts`. Run it twice; the second run should
# report everything unchanged.
seed-concepts = "app.seed.concepts:main"
# Local development only: rebuilds a class with students and PINs so the student-facing
# screens can be exercised without the magic-link dance. Refuses non-localhost databases.
seed-demo = "app.seed.demo:main"
# Validate a YAML problem file without a database: `uv run check-problems FILE.yaml`.
# Importing happens in the app, under the teacher's own identity.
check-problems = "app.problem_import:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
