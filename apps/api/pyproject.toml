[project]
name = "api"
version = "0.1.0"
description = "Coding-teaching-tool API — FastAPI backend"
requires-python = ">=3.12"
authors = [
    { name = "ryuken101", email = "169988777+ryuken101@users.noreply.github.com" }
]
dependencies = [
    "fastapi>=0.115",
    "sqlmodel>=0.0.22",
    "sqlalchemy[asyncio]>=2.0",  # the asyncio extra pulls in greenlet
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "asyncpg>=0.30",
    "uuid-utils>=0.10",
    "uvicorn[standard]>=0.32",
    "pyjwt[crypto]>=2.10",
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
