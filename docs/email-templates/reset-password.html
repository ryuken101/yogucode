<!--
  Supabase → Authentication → Emails → Templates → "Reset Password".
  Subject:  Reset your Yogucode password
  Paste everything below this comment into the "Message body" box.
  Inline styles and tables because Gmail and Outlook strip <style> and ignore flexbox;
  the cup is a PNG because Gmail does not show SVG.
-->
<!doctype html>
<html lang="en">
  <body style="margin:0;padding:0;background:#FFF6E9;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#FFF6E9;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;">
            <tr>
              <td align="center" style="padding-bottom:20px;">
                <img src="https://yogucode.com/yogucode-cup.png" width="64" height="64" alt="Yogucode" style="display:block;border:0;border-radius:16px;" />
              </td>
            </tr>
            <tr>
              <td style="background:#FFFFFF;border:1px solid #EFE6D8;border-radius:24px;padding:32px;font-family:'Fredoka',ui-rounded,'Segoe UI',Helvetica,Arial,sans-serif;color:#4B2FB8;">
                <h1 style="margin:0 0 12px;font-size:24px;line-height:1.2;font-weight:600;color:#4B2FB8;">Choose a new password</h1>
                <p style="margin:0 0 24px;font-size:16px;line-height:1.5;color:#4B2FB8;">
                  Tap the button to choose a new password. The link works once and expires in an hour.
                </p>
                <table role="presentation" cellpadding="0" cellspacing="0">
                  <tr>
                    <td style="background:#4B2FB8;border-radius:16px;">
                      <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:12px 24px;font-size:16px;font-weight:600;color:#FFFFFF;text-decoration:none;font-family:'Fredoka',ui-rounded,'Segoe UI',Helvetica,Arial,sans-serif;">Choose a new password</a>
                    </td>
                  </tr>
                </table>
                <p style="margin:24px 0 0;font-size:13px;line-height:1.5;color:#6A58A8;">
                  Didn't ask for this? You can ignore it — your password stays the same.
                </p>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding-top:20px;font-family:'Fredoka',ui-rounded,'Segoe UI',Helvetica,Arial,sans-serif;font-size:13px;color:#6A58A8;">
                Yogucode
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
